org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 ships built-in Kotlin support and a new DSL. This project intentionally
# uses the standalone Kotlin Gradle plugin so the Compose and kotlinx.serialization
# compiler plugins keep working with a standard plugin block.
# TODO(agp10): migrate to built-in Kotlin before AGP 10 removes these opt-outs.
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
